# Spring Boot 项目 CI/CD 工作流
# 仅在代码推送到 main 分支时触发

name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ main ]  # 仅在推送到 main 分支时触发
  pull_request:
    branches: [ main ]  # 可选：在针对 main 分支的 PR 时也触发

# 环境变量配置
env:
  JAVA_VERSION: '17'  # JDK 版本，可根据项目需求修改为 11、17、21 等
  MYSQL_VERSION: '8.0'  # MySQL 版本
  DOCKER_IMAGE_NAME: spring-boot-app  # Docker 镜像名称

jobs:
  # ==================== 构建与测试阶段 ====================
  build-and-test:
    name: 构建与单元测试
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 运行器
    
    # 服务容器配置 - 自动启动 MySQL
    services:
      mysql:
        image: mysql:${{ env.MYSQL_VERSION }}
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 步骤 1: 检出代码
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # 步骤 2: 设置 JDK 环境
      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'  # 使用 Temurin JDK（Eclipse Adoptium）
          cache: maven  # 启用 Maven 依赖缓存以加速构建

      # 步骤 3: 缓存 Maven 依赖
      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 步骤 4: 等待 MySQL 服务就绪
      - name: 等待 MySQL 服务就绪
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot_password --silent; then
              echo "MySQL 服务已就绪"
              break
            fi
            echo "等待 MySQL 启动... ($i/30)"
            sleep 2
          done

      # 步骤 5: 执行 Maven 构建和单元测试
      - name: 执行 Maven 构建和单元测试
        env:
          # 传递数据库连接信息给测试环境
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_password
        run: mvn clean verify -B -DskipITs=false

      # 步骤 6: 上传测试结果（可选）
      - name: 上传测试结果
        if: always()  # 即使测试失败也上传
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ==================== Docker 镜像构建阶段 ====================
  docker-build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: build-and-test  # 依赖构建与测试阶段，确保测试通过后才执行
    
    # 仅在 main 分支的 push 事件时执行（不在 PR 时执行）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # 步骤 1: 检出代码
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # 步骤 2: 设置 JDK 环境（用于 Maven 构建）
      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # 步骤 3: 构建 Spring Boot JAR 包
      - name: 构建 Spring Boot 应用
        run: mvn clean package -DskipTests -B

      # 步骤 4: 设置 Docker Buildx（支持多平台构建和缓存）
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤 5: 登录到 Docker Hub（可选，如需推送镜像）
      - name: 登录 Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 步骤 6: 提取 Git 元数据用于 Docker 标签
      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      # 步骤 7: 构建并推送 Docker 镜像
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  # Dockerfile 路径
          push: ${{ github.ref == 'refs/heads/main' }}  # 仅在 main 分支推送
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha  # 使用 GitHub Actions 缓存
          cache-to: type=gha,mode=max
          
      # 步骤 8: 输出镜像信息
      - name: 输出 Docker 镜像信息
        run: |
          echo "Docker 镜像已构建完成"
          echo "镜像标签: ${{ steps.meta.outputs.tags }}"

